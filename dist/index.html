<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="依据阳宅风水笔记规则整理的个人与通用风水计算工具。">
  <title>宅理通｜阳宅风水计算工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310232a'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23d7bc78' stroke-width='3'/%3E%3Cpath d='M32 11v42M11 32h42M17 17l30 30M47 17L17 47' stroke='%23f5f1e6' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23c9543d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="宅理通首页">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span><b>宅理通</b><small>阳宅风水计算工具</small></span>
      </a>
      <div class="year-chip" id="todayChip"></div>
    </header>

    <main>
      <section class="intro">
        <div>
          <p class="eyebrow">规则可查 · 过程可核</p>
          <h1>从个人命卦到年月方位，<br>常用风水计算一站完成。</h1>
          <p class="lede">输入出生资料生成个人结果，选择年份查看各项通用方位。每项结果均标明计算依据、实际作用与使用条件。</p>
        </div>
        <div class="compass-art" aria-hidden="true">
          <svg class="luopan-icon" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="luopanPaper" cx="50%" cy="42%" r="62%">
                <stop offset="0" stop-color="#fffdf7"/>
                <stop offset="1" stop-color="#e8dfcc"/>
              </radialGradient>
              <filter id="luopanShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#10232a" flood-opacity=".16"/>
              </filter>
              <clipPath id="centerClip"><circle cx="160" cy="160" r="56"/></clipPath>
            </defs>
            <g filter="url(#luopanShadow)">
              <circle cx="160" cy="160" r="147" fill="url(#luopanPaper)" stroke="#b78b3c" stroke-width="2"/>
              <circle cx="160" cy="160" r="137" fill="none" stroke="#10232a" stroke-width="1.5"/>
              <polygon points="160,24 256,64 296,160 256,256 160,296 64,256 24,160 64,64" fill="none" stroke="#b78b3c" stroke-width="1.5"/>
              <polygon points="160,45 241,79 275,160 241,241 160,275 79,241 45,160 79,79" fill="rgba(31,102,92,.06)" stroke="#1f665c" stroke-width="1"/>
              <g class="compass-rays">
                <path d="M160 24V78M160 242V296M24 160H78M242 160H296"/>
                <path d="M63.8 63.8l38.2 38.2M218 218l38.2 38.2M256.2 63.8L218 102M102 218l-38.2 38.2"/>
              </g>
              <circle cx="160" cy="160" r="83" fill="#f5f1e6" stroke="#b78b3c" stroke-width="2"/>
              <circle cx="160" cy="160" r="68" fill="none" stroke="#10232a" stroke-width="8"/>
              <circle cx="160" cy="160" r="56" fill="#10232a" stroke="#d7bc78" stroke-width="2"/>
              <g clip-path="url(#centerClip)" class="orbit-mark">
                <circle cx="190" cy="129" r="62"/>
                <circle cx="190" cy="129" r="43"/>
                <circle cx="190" cy="129" r="25"/>
              </g>
              <g class="compass-needle">
                <path d="M160 130l7 30-7 8-7-8z"/>
                <path d="M160 190l-7-30 7-8 7 8z"/>
                <circle cx="160" cy="160" r="5"/>
              </g>
            </g>
            <g class="gua-labels">
              <text x="160" y="51"><tspan class="gua-symbol">☲</tspan><tspan x="160" dy="15">离</tspan></text>
              <text x="239" y="82"><tspan class="gua-symbol">☷</tspan><tspan x="239" dy="15">坤</tspan></text>
              <text x="274" y="157"><tspan class="gua-symbol">☱</tspan><tspan x="274" dy="15">兑</tspan></text>
              <text x="239" y="235"><tspan class="gua-symbol">☰</tspan><tspan x="239" dy="15">乾</tspan></text>
              <text x="160" y="269"><tspan class="gua-symbol">☵</tspan><tspan x="160" dy="15">坎</tspan></text>
              <text x="81" y="235"><tspan class="gua-symbol">☶</tspan><tspan x="81" dy="15">艮</tspan></text>
              <text x="46" y="157"><tspan class="gua-symbol">☳</tspan><tspan x="46" dy="15">震</tspan></text>
              <text x="81" y="82"><tspan class="gua-symbol">☴</tspan><tspan x="81" dy="15">巽</tspan></text>
            </g>
          </svg>
        </div>
      </section>

      <nav class="mode-tabs" aria-label="计算类型">
        <button class="mode-tab active" data-mode="personal">个人计算</button>
        <button class="mode-tab" data-mode="general">通用计算</button>
      </nav>

      <section id="personal" class="mode-panel active" aria-labelledby="personalTitle">
        <div class="workspace-grid">
          <form class="control-card" id="personalForm">
            <div class="section-label">个人资料</div>
            <h2 id="personalTitle">一次输入，生成个人理气结果</h2>
            <label>出生日期
              <input type="date" id="birthDate" value="1990-06-15" required>
            </label>
            <label>出生时间 <span class="optional">用于立春交界判断</span>
              <input type="time" id="birthTime" value="12:00">
            </label>
            <fieldset>
              <legend>性别</legend>
              <div class="segmented">
                <label><input type="radio" name="gender" value="male" checked><span>男</span></label>
                <label><input type="radio" name="gender" value="female"><span>女</span></label>
              </div>
            </fieldset>
            <button class="primary" type="submit">生成个人结果</button>
            <p class="form-note">当前按中国标准时间计算；出生年以立春时刻为界。</p>
          </form>

          <div class="result-area" id="personalResults" aria-live="polite"></div>
        </div>
      </section>

      <section id="general" class="mode-panel" aria-labelledby="generalTitle">
        <div class="general-head">
          <div>
            <div class="section-label">通用方位</div>
            <h2 id="generalTitle">各项独立计算，互不混用</h2>
          </div>
          <label class="year-select">查询干支年
            <select id="queryYear"></select>
          </label>
        </div>

        <div class="module-tabs" id="moduleTabs" role="tablist">
          <button class="module-tab active" data-module="annual">流年九星</button>
          <button class="module-tab" data-module="monthly">全年流月盘</button>
          <button class="module-tab" data-module="yearTiger">年五虎杀</button>
          <button class="module-tab" data-module="monthTiger">全年月五虎</button>
          <button class="module-tab" data-module="earth">太岁 · 三煞</button>
          <button class="module-tab" data-module="hidden">暗建杀</button>
          <button class="module-tab" data-module="noble">天乙贵人</button>
          <button class="module-tab" data-module="wenchang">流年文昌</button>
          <button class="module-tab" data-module="fame">利名星</button>
        </div>
        <div id="moduleResult" class="module-result" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p>本工具用于执行既定传统规则并展示推算过程。通用方位不等同于具体住宅结论；财位、非位及同宫判断仍需房屋坐山与宅盘。</p>
      <p>数据仅供参考。联系邮箱：<a href="mailto:chenht_liyuan@126.com">chenht_liyuan@126.com</a></p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
